name: myworkflow1
on:
  push:
  workflow_dispatch:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
           whoami
           pwd
           cd 
           cat /etc/os-release
           docker --version
           docker compose version
      - name: mystep2-clone the repo in current directory
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-check the docker image
        run: docker image build -t shivanipanwar/shivaniimage_nov3:t1 -f Dockerfile .  
      - name: mystep5-check the docker image 
        run: docker images
      - name: mystep6-login to dockerhub
        uses: docker/login-actions@v3
        with:
          username: ${{ secrets. DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: mystep8-login to product server using action
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTIN_HOST }}
          username: ${{ secrets. PRODUCTION_USER }}
          key: ${{ secrets. PRODUCTION_SSH_KEY }}
          script: |
            set -e
            docker container rm -f prodcont
            docker run --name prodcont -dit -p 9092:80 shivanipanwar/shivaniimage_nov3:t1
